<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Chatbot</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: auto; padding: 16px; background: #f4f4f9; }
    #chat { padding-bottom: 80px; }
    .msg { padding: 12px; border-radius: 12px; margin: 10px 0; max-width: 85%; word-wrap: break-word; line-height: 1.4; }
    .user { background: #0070f3; color: white; margin-left: auto; }
    .assistant { background: white; color: #111; border: 1px solid #ddd; }
    .meta { font-size: 11px; color: #888; margin-top: 6px; }
    #loading { color: #888; font-style: italic; padding: 10px; display: none; }
    .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 20px; background: #0070f3; color: white; border: none; border-radius: 8px; font-size: 16px; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Qwen Chatbot</h2>
  <div id="chat"></div>
  <div id="loading">Qwen is typing...</div>

  <div class="input-bar">
    <input id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()" />
    <button id="sendBtn" onclick="send()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const loading = document.getElementById('loading');
    const sendBtn = document.getElementById('sendBtn');
    let history = [];

    async function send() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if (!text) return;

      // Show user message
      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      // Show loading
      loading.style.display = 'block';
      sendBtn.disabled = true;
      sendBtn.textContent = '...';
      
      const startTime = Date.now();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history })
        });
        const data = await res.json();
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

        // Hide loading
        loading.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';

        // Show assistant message + meta
        chat.innerHTML += `
          <div class="msg assistant">
            ${data.response}
            <div class="meta">⏱ ${data.time_taken || elapsed}s · 🪙 ${data.total_tokens || '?'} tokens (${data.prompt_tokens || '?'} in / ${data.completion_tokens || '?'} out)</div>
          </div>`;
        chat.scrollTop = chat.scrollHeight;
        history.push([text, data.response]);

      } catch (err) {
        loading.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
        chat.innerHTML += `<div class="msg assistant" style="color:red;">⚠️ Error: Could not reach server.</div>`;
      }
    }
  </script>
</body>
</html>
